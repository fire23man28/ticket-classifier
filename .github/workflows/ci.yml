name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn scikit-learn pandas joblib pytest httpx ruff
      - name: Lint
        run: ruff check .
      - name: Train model
        run: python train.py
      - name: Test
        run: pytest